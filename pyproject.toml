[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Self-hosted financial intelligence platform"
requires-python = ">=3.12"

[project.optional-dependencies]
api = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "asyncpg==0.29.0",
    "redis==5.0.8",
    "motor==3.5.1",
    "pymongo==4.7.3",
    "httpx==0.27.2",
    "prometheus-fastapi-instrumentator==7.0.0",
    "python-dotenv==1.0.1",
    "msgpack==1.1.0",
]
worker = [
    "arq==0.26.1",
    "redis==5.0.8",
    "asyncpg==0.29.0",
]
bot = [
    "discord.py==2.4.0",
    "httpx==0.27.2",
]
dev = [
    "ruff==0.5.0",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
