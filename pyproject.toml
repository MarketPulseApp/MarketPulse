[tool.black]
      line-length = 100
      target-version = ["py311"]

      [tool.ruff]
      line-length = 100
      select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ"]
      ignore = ["S101"]  # allow assert in tests

      [tool.mypy]
      python_version = "3.11"
      strict = true
      ignore_missing_imports = true