services:
  api:
    build: ./app
    container_name: marketpulse-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./secrets:/opt/marketpulse/secrets

  worker:
    build: 
      context: .
      dockerfile: ./workers/Dockerfile
    container_name: marketpulse-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "8082:8082"
    volumes:
      - ./data:/data
      - ./secrets:/opt/marketpulse/secrets

  bot:
    build: ./bot
    container_name: marketpulse-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8081"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: marketpulse-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  promtail:
    image: grafana/promtail:latest
    container_name: marketpulse-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  ml_sidecar:
    build:
      context: .
      dockerfile: ./ml_sidecar/Dockerfile
    container_name: marketpulse-ml-sidecar
    restart: unless-stopped
    env_file: .env
    ports:
      - "8085:8085"
    volumes:
      - ./models:/opt/marketpulse/models

  web_dashboard:
    build: ./web_dashboard
    container_name: marketpulse-web-dashboard
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: marketpulse-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
      - ./config.yml:/etc/cloudflared/config.yml:ro
