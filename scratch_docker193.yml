services:
  prometheus:
    image: prom/prometheus:latest
    container_name: marketpulse-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: marketpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GF_SMTP_USER}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: MarketPulse Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro

  loki:
    image: grafana/loki:latest
    container_name: marketpulse-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./observability/loki.yml:/etc/loki/loki.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: marketpulse-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: marketpulse-opa
    restart: unless-stopped
    command: run --server --addr :8181 --log-level info /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  homer:
    image: b4bz/homer:latest
    container_name: marketpulse-homer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./homer/assets:/www/assets

  dbgate:
    image: dbgate/dbgate:latest
    container_name: marketpulse-dbgate
    restart: unless-stopped
    ports:
      - "8082:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiZGE1YmIyMTM1YjNlMTFiZDI3YmEyNjllMGMzZGE3Y2QiLCJ0IjoiYjg2ZTRlZDktZWU2Yy00ZWI3LWFiMTQtZDBmNmI4MWFiNWE0IiwicyI6IllXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlXRmhZV0ZoWVdGaFlRPT0ifQ==

